name: program-v1
on:
  push:
    branches: [claude/program-v1, claude/paired-doors]
    paths:
      - 'program/programs/**'
      - 'program/test-fixtures/**'
      - 'program/scripts/**'
      - 'program/Cargo.toml'
      - 'program/Cargo.lock'
      - 'program/dependency-policy.json'
      - 'program/Anchor.toml'
      - 'program/idl/**'
      - 'program/devnet/**'
      - '.github/workflows/program-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: program-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/solana/v1.58
          key: linux-solana-platform-tools-v1.58
      - name: Host compile
        run: |
          cargo fmt -- --check
          cargo check --locked --tests
      - name: Check dependency advisories
        run: python3 scripts/audit_dependencies.py --check
      - name: Install current SBF builder and Anchor
        run: |
          if ! command -v cargo-build-sbf; then cargo install cargo-build-sbf --version 4.5.0 --locked; fi
          curl --fail --location --retry 3 https://github.com/otter-sec/anchor/releases/download/v1.2.2/anchor-1.2.2-x86_64-unknown-linux-gnu -o "$HOME/.cargo/bin/anchor"
          chmod +x "$HOME/.cargo/bin/anchor"
          curl --fail --location --retry 3 https://release.anza.xyz/v4.4.0/install -o /tmp/agave-install.sh
          sh /tmp/agave-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p verification
          { rustc --version; cargo --version; "$HOME/.cargo/bin/cargo-build-sbf" --version; anchor --version; } | tee verification/toolchain.txt
      - name: Build SBF
        run: |
          set -o pipefail
          "$HOME/.cargo/bin/cargo-build-sbf" --tools-version v1.58 2>&1 | tee verification/sbf-build.log
          python3 -c 'from pathlib import Path; s=Path("verification/sbf-build.log").read_text(); assert "Error: Function" not in s, "SBF stack error"'
          "$HOME/.cargo/bin/cargo-build-sbf" --tools-version v1.58 --manifest-path test-fixtures/launch_proxy/Cargo.toml --sbf-out-dir "$(pwd)/target/deploy"
      - name: Build IDL
        run: |
          mkdir -p target/idl
          anchor idl build -o target/idl/doors_v1.json
          cmp idl/doors_v1.json target/idl/doors_v1.json
          python3 scripts/check_layouts.py
      - name: Load the pinned SPL binaries offline for paired doors
        if: github.ref_name == 'claude/paired-doors'
        run: |
          python3 scripts/check_paired_completion.py
          (cd test-fixtures/spl && sha256sum -c "$GITHUB_WORKSPACE/program/devnet/SPL_PROGRAMS.sha256")
          cp test-fixtures/spl/manifest.json verification/paired-spl.json
          echo "DOORS_SVM_CLUSTER_PROGRAMS=$GITHUB_WORKSPACE/program/test-fixtures/spl" >> "$GITHUB_ENV"
      - name: Prove the launch regression fails with the bound disabled
        if: github.ref_name == 'claude/paired-doors'
        run: |
          cp programs/doors_v1/src/lib.rs "$RUNNER_TEMP/review-lib.rs"
          cp target/deploy/doors_v1.so "$RUNNER_TEMP/review-program.so"
          trap 'cp "$RUNNER_TEMP/review-lib.rs" programs/doors_v1/src/lib.rs; cp "$RUNNER_TEMP/review-program.so" target/deploy/doors_v1.so' EXIT
          python3 -c 'from pathlib import Path; p=Path("programs/doors_v1/src/lib.rs"); s=p.read_text(); lines=s.splitlines(True); assert sum("launch.check_room_reserve(" in l for l in lines)==2; p.write_text("".join(l for l in lines if "launch.check_room_reserve(" not in l))'
          "$HOME/.cargo/bin/cargo-build-sbf" --tools-version v1.58 > verification/price-limit-negative-build.log 2>&1
          set +e
          cargo test --locked --test svm review_room_reserve_limit_refuses_front_run_and_zero_accepts -- --nocapture > verification/price-limit-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'assertion failed: !door_open_sandwich_limit' verification/price-limit-negative.log
      - name: Execute SBF tests and mixed-operation property test
        run: |
          set -o pipefail
          cargo test --locked --test svm -- --nocapture 2>&1 | tee verification/svm.log
      - name: Verify isolated test-only stress build
        if: github.ref_name == 'claude/paired-doors'
        run: |
          "$HOME/.cargo/bin/cargo-build-sbf" --tools-version v1.58 --features test-stress --sbf-out-dir target/stress
          cargo test --locked --features test-stress --test svm adversarial_normal_admin_can_select_the_stress_cap -- --nocapture
          cargo test --locked --features test-stress --test svm paired_doors_stress_config_exercises_supply_exhaustion -- --nocapture
          sha256sum target/stress/doors_v1.so > verification/stress-elf.sha256
      - name: Format check
        run: cargo fmt -- --check
      - name: Verify committed build inputs
        run: git diff --exit-code -- Cargo.lock Cargo.toml Anchor.toml programs test-fixtures idl
      - name: Generate measured evidence
        run: |
          python3 scripts/build_evidence.py
          if [ "${{ github.ref_name }}" != "claude/paired-doors" ]; then
            python3 scripts/report_cu.py
          fi
      - name: Measure paired doors heap and compile devnet client
        if: github.ref_name == 'claude/paired-doors'
        run: |
          set -o pipefail
          cargo test --locked --manifest-path devnet/Cargo.toml 2>&1 | tee verification/devnet-client-tests.log
          cargo build --locked --release --manifest-path devnet/Cargo.toml
          python3 scripts/heap_probe.py
          python3 scripts/door_curve_fuzz.py --json verification/door_curve_fuzz.json
          python3 scripts/report_paired_doors.py --report docs/PAIRED_DOORS_REPORT.md > verification/paired_report.md
          sha256sum -c devnet/DEPLOY_ELF.sha256
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-v1-${{ github.sha }}
          path: |
            program/Cargo.lock
            program/target/deploy/doors_v1.so
            program/target/idl/doors_v1.json
            program/devnet/target/release/doors-devnet
            program/verification/
            program/docs/PAIRED_DOORS_REPORT.md
            program/programs/doors_v1/src/
            program/programs/doors_v1/tests/
            program/test-fixtures/launch_proxy/Cargo.lock
          if-no-files-found: warn
