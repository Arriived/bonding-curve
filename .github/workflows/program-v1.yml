name: program-v1
on:
  push:
    branches: [claude/program-v1, codex/m8-h1-m6]
    paths:
      - 'program/programs/**'
      - 'program/test-fixtures/**'
      - 'program/scripts/**'
      - 'program/Cargo.toml'
      - 'program/Cargo.lock'
      - 'program/dependency-policy.json'
      - 'program/Anchor.toml'
      - 'program/idl/**'
      - 'services/matcher/**'
      - '.github/workflows/program-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: program-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/solana/v1.58
          key: linux-solana-platform-tools-v1.58
      - name: Host compile
        run: |
          cargo fmt -- --check
          cargo check --locked --tests
      - name: Check dependency advisories
        run: python3 scripts/audit_dependencies.py --check
      - name: Install current SBF builder and Anchor
        run: |
          if ! command -v cargo-build-sbf; then cargo install cargo-build-sbf --version 4.5.0 --locked; fi
          curl --fail --location --retry 3 https://github.com/otter-sec/anchor/releases/download/v1.2.2/anchor-1.2.2-x86_64-unknown-linux-gnu -o "$HOME/.cargo/bin/anchor"
          chmod +x "$HOME/.cargo/bin/anchor"
          curl --fail --location --retry 3 https://release.anza.xyz/v4.4.0/install -o /tmp/agave-install.sh
          sh /tmp/agave-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p verification
          { rustc --version; cargo --version; "$HOME/.cargo/bin/cargo-build-sbf" --version; anchor --version; } | tee verification/toolchain.txt
      - name: Build SBF
        run: |
          set -o pipefail
          "$HOME/.cargo/bin/cargo-build-sbf" --tools-version v1.58 2>&1 | tee verification/sbf-build.log
          python3 -c 'from pathlib import Path; s=Path("verification/sbf-build.log").read_text(); assert "Error: Function" not in s, "SBF stack error"'
          "$HOME/.cargo/bin/cargo-build-sbf" --tools-version v1.58 --manifest-path test-fixtures/launch_proxy/Cargo.toml --sbf-out-dir "$(pwd)/target/deploy"
      - name: Build IDL
        run: |
          mkdir -p target/idl
          anchor idl build -o target/idl/doors_v1.json
          python3 scripts/check_layouts.py
      - name: Execute SBF tests and mixed-operation property test
        run: cargo test --locked --test svm -- --nocapture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify matcher regressions
        run: |
          python -m pip install -r ../services/matcher/requirements-dev.txt
          python -m pytest ../services/matcher/tests -q
      - name: Check committed IDL
        run: cmp idl/doors_v1.json target/idl/doors_v1.json
      - name: Format check
        run: cargo fmt -- --check
      - name: Verify committed build inputs
        run: git diff --exit-code -- Cargo.lock Cargo.toml Anchor.toml programs test-fixtures idl
      - name: Generate measured evidence
        run: |
          python3 scripts/build_evidence.py
          python3 scripts/report_cu.py
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-v1-${{ github.sha }}
          path: |
            program/Cargo.lock
            program/target/deploy/doors_v1.so
            program/target/idl/doors_v1.json
            program/verification/
            program/programs/doors_v1/src/
            program/programs/doors_v1/tests/
            program/test-fixtures/launch_proxy/Cargo.lock
          if-no-files-found: warn
