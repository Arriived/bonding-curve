name: program-v1
on:
  push:
    branches: [claude/program-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: program-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
          cache-on-failure: true
      - name: Host compile
        run: cargo check --lib
      - name: Install current SBF builder and Anchor
        run: |
          if ! command -v cargo-build-sbf; then cargo install cargo-build-sbf --version 4.5.0 --locked; fi
          curl --fail --location --retry 3 https://github.com/otter-sec/anchor/releases/download/v1.2.2/anchor-1.2.2-x86_64-unknown-linux-gnu -o "$HOME/.cargo/bin/anchor"
          chmod +x "$HOME/.cargo/bin/anchor"
          mkdir -p verification
          { rustc --version; cargo --version; cargo-build-sbf --version; anchor --version; } | tee verification/toolchain.txt
      - name: Build SBF
        run: cargo build-sbf --tools-version v1.58
      - name: Build IDL
        run: anchor idl build -o target/idl/doors_v1.json
      - name: Execute SBF tests and mixed-operation property test
        run: cargo test --test svm -- --nocapture
      - name: Format check
        run: cargo fmt -- --check
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-v1-${{ github.sha }}
          path: |
            program/Cargo.lock
            program/target/deploy/doors_v1.so
            program/target/idl/doors_v1.json
            program/verification/
          if-no-files-found: warn
