[package]
name = "doors-v1"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "doors_v1"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.2", default-features = false, features = ["solana-v4"] }
spl-token-2022-interface = "=3.0.0"
spl-token-interface = "=3.0.0"
spl-token-metadata-interface = "=1.0.0"
solana-sha256-hasher = { version = "3", features = ["sha2"] }
solana-nullable = "1"

[dev-dependencies]
litesvm = "=0.18.1"
solana-account = "4"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["verify"] }
solana-message = "4"
solana-instruction = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-compute-budget-interface = "3"
serde_json = "1"
solana-clock = "~3.2.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))']
