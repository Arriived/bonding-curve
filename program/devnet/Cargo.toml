[package]
name = "doors-devnet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Devnet deployment initialiser, smoke test and failure-case runner for doors_v1"

# Standalone: keeps the program workspace's Cargo.lock (checked by CI) untouched.
[workspace]

[dependencies]
doors-v1 = { path = "../programs/doors_v1", features = ["no-entrypoint"] }
anchor-lang = { version = "=1.2.2", default-features = false, features = ["solana-v4"] }
spl-token-2022-interface = "=3.0.0"
spl-token-interface = "=3.0.0"
spl-token-metadata-interface = "=1.0.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["serde", "wincode"] }
bincode = "1.3"
solana-message = "4"
solana-instruction = "3"
solana-compute-budget-interface = "3"
solana-signature = "3"
solana-hash = "4"
serde_json = "1"
anyhow = "1"
